<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 570" role="img" aria-label="Configuration Service model: organization, profiles, code, content sources and sites">
<style>
  text{font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
  .h{font-size:22px;font-weight:700;fill:#10182B}
  .sub{font-size:14px;fill:#5B6478}
  .t{font-size:15px;font-weight:600;fill:#10182B}
  .s{font-size:12.5px;fill:#5B6478}
  .lbl{font-size:12px;font-weight:600;fill:#475569}
  .lb{font-size:12px;font-weight:700;fill:#1D4ED8}
  .lo{font-size:12px;font-weight:700;fill:#C2410C}
  .lr{font-size:12px;font-weight:700;fill:#B91C1C}
  .box{fill:#FFFFFF;stroke:#CBD2E1;stroke-width:1.5}
  .q{fill:#FFFFFF;stroke:#10182B;stroke-width:1.5}
  .blue{fill:#EFF4FF;stroke:#2563EB;stroke-width:2}
  .orange{fill:#FFF4EC;stroke:#EA580C;stroke-width:2}
  .green{fill:#ECFDF5;stroke:#059669;stroke-width:1.5}
  .grey{fill:#F1F3F8;stroke:#94A3B8;stroke-width:1.5}
  .navy{fill:#EEF0F6;stroke:#10182B;stroke-width:1.5}
  .arr{stroke:#64748B;stroke-width:2;fill:none;marker-end:url(#a)}
  .line{stroke:#64748B;stroke-width:2;fill:none}
  .red{stroke:#DC2626;stroke-width:2;fill:none;stroke-dasharray:5 4;marker-end:url(#ar);marker-start:url(#ar)}
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker>
</defs>
<rect width="1200" height="570" rx="16" fill="#F7F8FB"/>
<text class="h" x="30" y="48">How a repoless site is put together</text>
<text class="sub" x="30" y="72">A site is just configuration: which code, which content, which settings</text>

<rect x="450" y="92" width="300" height="58" rx="12" fill="#10182B"/>
<text class="t" x="600" y="117" text-anchor="middle" style="fill:#FFFFFF">Org: acme</text>
<text class="s" x="600" y="137" text-anchor="middle" style="fill:#C7CEDD">same name as the GitHub org</text>
<path class="arr" d="M600,152 V172 H210 V196"/>
<path class="arr" d="M600,152 V196"/>
<path class="arr" d="M600,152 V172 H990 V196"/>

<rect class="blue" x="60" y="200" width="300" height="110" rx="10"/>
<text class="t" x="210" y="232" text-anchor="middle">Profile: brand-defaults</text>
<text class="s" x="210" y="255" text-anchor="middle">headers · index definitions</text>
<text class="s" x="210" y="273" text-anchor="middle">metadata · sidekick plugins</text>
<text class="s" x="210" y="291" text-anchor="middle">shared by many sites</text>

<rect class="box" x="450" y="200" width="300" height="110" rx="10"/>
<text class="t" x="600" y="232" text-anchor="middle">Code: acme/brand-web</text>
<text class="s" x="600" y="255" text-anchor="middle">one GitHub repo, AEM Code Sync</text>
<text class="s" x="600" y="273" text-anchor="middle">canonical site keeps code synced</text>
<text class="s" x="600" y="291" text-anchor="middle">every push reaches every site</text>

<rect class="box" x="840" y="200" width="300" height="110" rx="10"/>
<text class="t" x="990" y="232" text-anchor="middle">Content sources</text>
<text class="s" x="990" y="255" text-anchor="middle">AEM author (Universal Editor)</text>
<text class="s" x="990" y="273" text-anchor="middle">Document Authoring · SharePoint</text>
<text class="s" x="990" y="291" text-anchor="middle">BYOM</text>

<path class="line" d="M210,312 V350"/>
<path class="line" d="M600,312 V350"/>
<path class="line" d="M990,312 V350"/>
<path class="line" d="M185,350 H995"/>
<path class="arr" d="M185,350 V386"/>
<path class="arr" d="M455,350 V386"/>
<path class="arr" d="M725,350 V386"/>
<path class="arr" d="M995,350 V386"/>

<rect class="green" x="60" y="390" width="250" height="96" rx="10"/>
<text class="t" x="185" y="418" text-anchor="middle">Site: brand-de</text>
<text class="s" x="185" y="440" text-anchor="middle">profile: brand-defaults</text>
<text class="s" x="185" y="458" text-anchor="middle">content: /content/brand/de</text>
<rect class="green" x="330" y="390" width="250" height="96" rx="10"/>
<text class="t" x="455" y="418" text-anchor="middle">Site: brand-ch</text>
<text class="s" x="455" y="440" text-anchor="middle">profile: brand-defaults</text>
<text class="s" x="455" y="458" text-anchor="middle">content: /content/brand/ch</text>
<rect class="green" x="600" y="390" width="250" height="96" rx="10"/>
<text class="t" x="725" y="418" text-anchor="middle">Site: brand-fr</text>
<text class="s" x="725" y="440" text-anchor="middle">profile: brand-defaults</text>
<text class="s" x="725" y="458" text-anchor="middle">content: /content/brand/fr</text>
<rect class="green" x="870" y="390" width="250" height="96" rx="10"/>
<text class="t" x="995" y="418" text-anchor="middle">Site: campaign-x</text>
<text class="s" x="995" y="440" text-anchor="middle">no profile, own settings</text>
<text class="s" x="995" y="458" text-anchor="middle">content: Document Authoring</text>

<text class="s" x="600" y="530" text-anchor="middle" style="font-style:italic">One profile per site at most · site settings override profile settings · code updates reach every site on the repo</text>
</svg>
