<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-label="Map of AI capabilities in AEM in November 2026 across six stages. Create: Generate Variations usable, Experience Production Agent conditional, Content Create limited availability, AI translation usable. Assets: smart tags and AI-generated metadata usable, Content Advisor discovery and Content Optimization conditional, Content Hub with Firefly usable with entitlements. Govern: Governance Agent conditional. Optimise: Sites Optimizer usable with early access parts. Be found by AI: LLM Optimizer usable, Brand Visibility and LLM Apps announced. Build and run: local AI tools usable, Development Agent and Experience Modernization Agent conditional, CX Enterprise Coworker announced.">
<style>
  text{font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
  .h{font-size:22px;font-weight:700;fill:#10182B}
  .sub{font-size:14px;fill:#5B6478}
  .t{font-size:14.5px;font-weight:700;fill:#10182B}
  .lbl{font-size:11px;font-weight:700;fill:#5B6478;letter-spacing:.08em}
  .s{font-size:12.5px;fill:#10182B}
  .col{fill:#FFFFFF;stroke:#C9D1E0;stroke-width:1.5}
  .u{fill:#ECFDF5;stroke:#059669;stroke-width:1.5}
  .c{fill:#FFF4EC;stroke:#EA580C;stroke-width:1.5}
  .a{fill:#F3F0FF;stroke:#6D5BD0;stroke-width:1.5;stroke-dasharray:5 4}
  .lg{font-size:12.5px;fill:#10182B}
</style>
<rect width="1200" height="660" rx="16" fill="#F7F8FB"/>
<text class="h" x="30" y="48">AI in AEM, November 2026: what exists, and in what state</text>
<text class="sub" x="30" y="72">Based on Adobe documentation and announcements. Statuses change monthly: check before you budget.</text>

