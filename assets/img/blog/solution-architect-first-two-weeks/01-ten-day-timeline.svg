<circle cx="44" cy="245" r="3" fill="#2563EB"/><text x="54" y="249">Meet the delivery lead</text>
<circle cx="44" cy="271" r="3" fill="#2563EB"/><text x="54" y="275">Draft stakeholder map</text></g>

