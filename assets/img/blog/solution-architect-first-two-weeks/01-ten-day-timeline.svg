<rect x="24" y="548" width="1152" height="76" rx="12" fill="#FFFFFF" stroke="#CBD2E1" stroke-width="1"/>
<text class="lbl" x="40" y="572">END OF WEEK 1</text>
<text class="s" x="170" y="572">Stakeholder map · interview notes · systems and integrations inventory · draft NFRs · RAID log · question log</text>
<text class="lbl" x="40" y="604">END OF WEEK 2</text>
