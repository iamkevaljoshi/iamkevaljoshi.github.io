<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-label="Timeline of a solution architect's first ten working days. Week 1, listen and map: day 1 kick-off and access requests, day 2 business interviews, day 3 technical interviews, day 4 current-state discovery, day 5 NFRs and playback. Week 2, shape: day 6 C4 context diagram, day 7 architecture decision records, day 8 spike on the riskiest assumption, day 9 definition of done and sprint 1 runway, day 10 architecture readout.">
<style>
  text{font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
  .h{font-size:22px;font-weight:700;fill:#10182B}
  .sub{font-size:14px;fill:#5B6478}
  .t{font-size:16px;font-weight:700;fill:#10182B}
  .w{font-size:12px;font-weight:600;fill:#5B6478}
  .s{font-size:12.5px;fill:#10182B}
  .lbl{font-size:11px;font-weight:700;fill:#5B6478;letter-spacing:.08em}
  .blue{fill:#EFF4FF;stroke:#2563EB;stroke-width:2}
  .violet{fill:#F3F0FF;stroke:#6D5BD0;stroke-width:2}
  .navy{fill:#EEF0F6;stroke:#10182B;stroke-width:2}
  .lg{font-size:12.5px;font-weight:700;fill:#047857}
</style>
<rect width="1200" height="660" rx="16" fill="#F7F8FB"/>
<text class="h" x="30" y="48">The first ten working days</text>
<text class="sub" x="30" y="72">Week 1 is for listening and mapping. Week 2 is for shaping decisions and getting sprint 1 ready.</text>

