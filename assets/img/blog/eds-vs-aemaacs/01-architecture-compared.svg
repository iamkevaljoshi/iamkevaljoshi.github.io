<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="Traditional AEM as a Cloud Service delivery compared with Edge Delivery Services">
<style>
  text{font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
  .h{font-size:22px;font-weight:700;fill:#10182B}
  .sub{font-size:14px;fill:#5B6478}
  .t{font-size:15px;font-weight:600;fill:#10182B}
  .s{font-size:12.5px;fill:#5B6478}
  .lbl{font-size:12px;font-weight:600;fill:#475569}
  .lb{font-size:12px;font-weight:700;fill:#1D4ED8}
  .lo{font-size:12px;font-weight:700;fill:#C2410C}
  .lg{font-size:12px;font-weight:700;fill:#047857}
  .box{fill:#FFFFFF;stroke:#CBD2E1;stroke-width:1.5}
  .q{fill:#FFFFFF;stroke:#10182B;stroke-width:1.5}
  .blue{fill:#EFF4FF;stroke:#2563EB;stroke-width:2}
  .orange{fill:#FFF4EC;stroke:#EA580C;stroke-width:2}
  .green{fill:#ECFDF5;stroke:#059669;stroke-width:1.5}
  .grey{fill:#F1F3F8;stroke:#94A3B8;stroke-width:1.5}
  .navy{fill:#EEF0F6;stroke:#10182B;stroke-width:1.5}
  .violet{fill:#F3F0FF;stroke:#6D5BD0;stroke-width:2}
  .arr{stroke:#64748B;stroke-width:2;fill:none;marker-end:url(#a)}
  .dash{stroke:#94A3B8;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#a)}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs>
<rect width="1200" height="600" rx="16" fill="#F7F8FB"/>
<text class="h" x="30" y="48">Two delivery architectures on AEM as a Cloud Service</text>
<text class="sub" x="30" y="72">Same author tier and governance; very different path from content to visitor</text>

<rect x="30" y="95" width="1140" height="215" rx="14" fill="#FFFFFF" stroke="#E2E6EF"/>
<text class="lbl" x="52" y="124" style="letter-spacing:.08em">TRADITIONAL · PUBLISH + DISPATCHER</text>
<rect class="box" x="52" y="140" width="165" height="76" rx="10"/><text class="t" x="134" y="172" text-anchor="middle">AEM Author</text><text class="s" x="134" y="193" text-anchor="middle">Page / Universal Editor</text>
<rect class="grey" x="252" y="140" width="190" height="76" rx="10"/><text class="t" x="347" y="172" text-anchor="middle">Publish tier</text><text class="s" x="347" y="193" text-anchor="middle">Sling · HTL · Java · OSGi</text>
<rect class="grey" x="477" y="140" width="165" height="76" rx="10"/><text class="t" x="559" y="172" text-anchor="middle">Dispatcher</text><text class="s" x="559" y="193" text-anchor="middle">cache · filters · rewrites</text>
<rect class="orange" x="677" y="140" width="165" height="76" rx="10"/><text class="t" x="759" y="172" text-anchor="middle">CDN</text><text class="s" x="759" y="193" text-anchor="middle">Adobe-managed or BYO</text>
<rect class="box" x="877" y="140" width="140" height="76" rx="10"/><text class="t" x="947" y="183" text-anchor="middle">Visitor</text>
<path class="arr" d="M219,178 H248"/>
<path class="arr" d="M444,178 H473"/><path class="arr" d="M644,178 H673"/><path class="arr" d="M844,178 H873"/>
<rect class="navy" x="252" y="238" width="420" height="48" rx="9"/><text class="s" x="462" y="267" text-anchor="middle" style="fill:#10182B">Cloud Manager: Maven build, tests, deploy (tens of minutes)</text>
<path class="dash" d="M447,236 V220"/>
<text class="s" x="1040" y="165">Server renders</text><text class="s" x="1040" y="183">every uncached</text><text class="s" x="1040" y="201">page in Java/HTL</text>

<rect x="30" y="330" width="1140" height="245" rx="14" fill="#FFFFFF" stroke="#E2E6EF"/>
<text class="lb" x="52" y="359" style="letter-spacing:.08em">EDGE DELIVERY SERVICES</text>
<rect class="blue" x="52" y="375" width="165" height="92" rx="10"/><text class="t" x="134" y="403" text-anchor="middle">Authoring</text><text class="s" x="134" y="424" text-anchor="middle">Universal Editor (AEM)</text><text class="s" x="134" y="441" text-anchor="middle">Document Authoring</text><text class="s" x="134" y="458" text-anchor="middle">SharePoint · Drive</text>
<rect class="box" x="252" y="375" width="190" height="92" rx="10"/><text class="t" x="347" y="410" text-anchor="middle">Admin API</text><text class="s" x="347" y="431" text-anchor="middle">preview · publish</text>
<rect class="green" x="477" y="375" width="165" height="92" rx="10"/><text class="t" x="559" y="410" text-anchor="middle">Content + Code Bus</text><text class="s" x="559" y="431" text-anchor="middle">aem.live origin</text>
<rect class="orange" x="677" y="375" width="165" height="92" rx="10"/><text class="t" x="759" y="410" text-anchor="middle">CDN</text><text class="s" x="759" y="431" text-anchor="middle">push invalidation</text>
<rect class="box" x="877" y="375" width="140" height="92" rx="10"/><text class="t" x="947" y="426" text-anchor="middle">Visitor</text>
<path class="arr" d="M219,421 H248"/><path class="arr" d="M444,421 H473"/><path class="arr" d="M644,421 H673"/><path class="arr" d="M844,421 H873"/>
<rect class="navy" x="477" y="495" width="165" height="56" rx="9"/><text class="t" x="559" y="519" text-anchor="middle">GitHub</text><text class="s" x="559" y="538" text-anchor="middle">blocks · Code Sync</text>
<path class="arr" d="M559,493 V471"/><text class="lbl" x="570" y="487">push = live in seconds</text>
<text class="s" x="1040" y="400">Pre-rendered</text><text class="s" x="1040" y="418">semantic HTML,</text><text class="s" x="1040" y="436">no publish tier</text><text class="s" x="1040" y="454">or Dispatcher</text>
</svg>
