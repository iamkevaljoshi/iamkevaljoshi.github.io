<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="One component, many pages: five shared components such as the header, card, carousel, image and form field feed templates and policies, which render on every page of the site. Fixing a component once fixes every page that uses it. Below, responsibilities are split between developers (semantic HTML, ARIA, keyboard and focus), designers (contrast, focus styles, target size) and authors (alt text, headings, link text, captions).">
