<text class="lg" x="796" y="358">One defect × every page = a site-wide failure.</text>
<text class="lg" x="796" y="380">Fix the component once, every page inherits it.</text>
<text class="lbl" x="24" y="428">WHO OWNS WHAT</text>
<rect class="orange" x="24" y="440" width="368" height="104" rx="12"/><text class="t" x="44" y="470">Developer</text>
<text class="s" x="44" y="498">Semantic HTML, ARIA, name/role/value</text>
<text class="s" x="44" y="522">Keyboard, focus order, status messages</text>
<rect class="green" x="416" y="440" width="368" height="104" rx="12"/><text class="t" x="436" y="470">Designer</text>
<text class="s" x="436" y="498">Contrast, visible focus styles</text>
<text class="s" x="436" y="522">Target size, reflow, motion, error states</text>
<rect class="navy" x="808" y="440" width="368" height="104" rx="12"/><text class="t" x="828" y="470">Author</text>
<text class="s" x="828" y="498">Alt text, heading order, link text</text>
<text class="s" x="828" y="522">Captions, transcripts, clear language</text>
<text class="lg" x="600" y="578" text-anchor="middle">Templates and policies are where the three roles meet: they decide what authors can and cannot get wrong.</text>
