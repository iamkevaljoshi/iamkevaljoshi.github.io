<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-label="Context layers for AI coding agents on AEM, compared for Edge Delivery Services and AEM as a Cloud Service. AGENTS.md is the project map: it ships in the EDS boilerplate, and for Java projects the ensure-agents-md skill generates it from pom.xml. Instruction files hold scoped rules. Skills are procedures from adobe/skills: create-site, content-driven-development, page-import and block-inventory for EDS; create-component, dispatcher, workflow, migration and code-assessment for AEMaaCS. MCP servers give runtime evidence: Browser MCP and Context7 for EDS; the AEM SDK Quickstart server and the Dispatcher SDK server for Java. Prompts stay short because the other layers carry the context.">
<style>
  text{font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
  .h{font-size:22px;font-weight:700;fill:#10182B}
  .sub{font-size:14px;fill:#5B6478}
  .t{font-size:16px;font-weight:700;fill:#10182B}
  .s{font-size:12.5px;fill:#10182B}
  .mu{font-size:12.5px;fill:#5B6478}
  .lbl{font-size:11px;font-weight:700;fill:#5B6478;letter-spacing:.08em}
  .navy{fill:#EEF0F6;stroke:#10182B;stroke-width:2}
  .blue{fill:#EFF4FF;stroke:#2563EB;stroke-width:2}
  .green{fill:#ECFDF5;stroke:#059669;stroke-width:2}
  .orange{fill:#FFF4EC;stroke:#EA580C;stroke-width:2}
  .violet{fill:#F3F0FF;stroke:#6D5BD0;stroke-width:2}
  .white{fill:#FFFFFF;stroke:#C9D1E0;stroke-width:1.5}
  .arr{stroke:#5B6478;stroke-width:2;fill:none}
  .warn{font-size:12.5px;font-weight:700;fill:#B45309}
</style>
<rect width="1200" height="640" rx="16" fill="#F7F8FB"/>
<text class="h" x="30" y="48">Five layers of context for AI agents on AEM</text>
<text class="sub" x="30" y="72">Same layers on both stacks, different contents. The first line of every AGENTS.md: which AEM this is, and which it is not.</text>
<text class="lbl" x="30" y="112">LAYER</text><text class="lbl" x="384" y="112">EDGE DELIVERY SERVICES</text><text class="lbl" x="800" y="112">AEM AS A CLOUD SERVICE (JAVA)</text>
<rect class="navy" x="24" y="124" width="340" height="86" rx="12"/>
<text class="t" x="40" y="152">AGENTS.md</text><text class="mu" x="40" y="175">The map: what the project is</text><text class="mu" x="40" y="194">Short, stable, in Git</text>
<rect class="white" x="376" y="124" width="404" height="86" rx="12"/><text class="s" x="392" y="158">Ships in the AEM Boilerplate</text><text class="s" x="392" y="177">Keep CLAUDE.md too · point at aem.live/llms.txt</text>
<rect class="white" x="792" y="124" width="384" height="86" rx="12"/><text class="s" x="808" y="158">Generated by ensure-agents-md from pom.xml</text><text class="s" x="808" y="177">Runs once, never overwrites: edit by hand</text>
<rect class="blue" x="24" y="222" width="340" height="86" rx="12"/>
<text class="t" x="40" y="250">Instruction files</text><text class="mu" x="40" y="273">Scoped rules for one concern</text><text class="mu" x="40" y="292">Linked from AGENTS.md</text>
<rect class="white" x="376" y="222" width="404" height="86" rx="12"/><text class="s" x="392" y="256">blocks.md · a11y.md · performance budget</text><text class="s" x="392" y="275">e.g. only LCP-critical code in the eager phase</text>
<rect class="white" x="792" y="222" width="384" height="86" rx="12"/><text class="s" x="808" y="256">testing.junit5.md · dispatcher.md</text><text class="s" x="808" y="275">e.g. service users via repoinit, no admin sessions</text>
<rect class="green" x="24" y="320" width="340" height="86" rx="12"/>
<text class="t" x="40" y="348">Skills</text><text class="mu" x="40" y="371">Procedures: how to do a task</text><text class="mu" x="40" y="390">adobe/skills plus your own</text>
<rect class="white" x="376" y="320" width="404" height="86" rx="12"/><text class="s" x="392" y="354">create-site · content-driven-development</text><text class="s" x="392" y="373">page-import · block-inventory · docs-search</text>
<rect class="white" x="792" y="320" width="384" height="86" rx="12"/><text class="s" x="808" y="354">create-component · dispatcher · workflow</text><text class="s" x="808" y="373">migration · code-assessment, one pattern at a time</text>
<rect class="violet" x="24" y="418" width="340" height="86" rx="12"/>
<text class="t" x="40" y="446">MCP servers</text><text class="mu" x="40" y="469">Runtime evidence, not guesses</text><text class="mu" x="40" y="488">Each one costs context</text>
<rect class="white" x="376" y="418" width="404" height="86" rx="12"/><text class="s" x="392" y="452">Browser MCP (screenshots) · Context7 docs</text><text class="s" x="392" y="471">Helix and DA MCP servers: unofficial</text>
<rect class="white" x="792" y="418" width="384" height="86" rx="12"/><text class="s" x="808" y="452">AEM SDK: aem-logs · diagnose-osgi-bundle</text><text class="s" x="808" y="471">Dispatcher SDK: validate · trace_request</text>
<rect class="orange" x="24" y="516" width="340" height="86" rx="12"/>
<text class="t" x="40" y="544">Prompts</text><text class="mu" x="40" y="567">Short, because the layers</text><text class="mu" x="40" y="586">above carry the context</text>
<rect class="white" x="376" y="516" width="404" height="86" rx="12"/><text class="s" x="392" y="550">"Build an embed block for Instagram URLs"</text><text class="s" x="392" y="569">plus a screenshot of the design</text>
