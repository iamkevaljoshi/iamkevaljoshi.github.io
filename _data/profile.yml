capabilities:
  - title: Solution & enterprise architecture
    text: Target-state design, reference architectures, roadmaps and architecture decision records tied to business outcomes.
  - title: Cloud & platform engineering
    text: Cloud-native and hybrid designs, environments, CI/CD and operability built in from day one.
  - title: Integration & API design
    text: API-led and event-driven integration, contract-first design, and clean boundaries between systems.
  - title: Digital experience platforms
    text: Content, commerce and customer-experience platforms, from selection and migration to build.
  - title: Security, performance & governance
    text: Non-functional requirements, threat modelling, performance budgets and review gates teams can live with.
  - title: Delivery leadership
    text: Technical leadership across squads, estimation, risk management and mentoring engineers.

principles:
  - title: Start with the decision
    text: Every diagram answers a question. I write down the context, options and trade-offs before the boxes and arrows.
  - title: Design for the people who run it
    text: Operability, observability and handover are architecture concerns, not afterthoughts.
  - title: Prefer boring, proven choices
    text: Spend novelty where it creates advantage, and standard patterns everywhere else.
  - title: Make it evolvable
    text: Clear seams, versioned contracts and fitness checks keep a design healthy as requirements change.

