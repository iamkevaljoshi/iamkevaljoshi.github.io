principles:
  - title: Start with the decision
    text: Every diagram answers a question. I write down the context, options and trade-offs before the boxes and arrows.
  - title: Design for the people who run it
    text: Operability, observability and handover are architecture concerns, not afterthoughts.
  - title: Prefer boring, proven choices
    text: Spend novelty where it creates advantage, and standard patterns everywhere else.
  - title: Make it evolvable
    text: Clear seams, versioned contracts and fitness checks keep a design healthy as requirements change.

