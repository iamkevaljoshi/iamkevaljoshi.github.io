assets:
  title: "AEM Assets and the DAM: zero to hero"
  short: "AEM Assets"
  icon: image
  lede: "A guided path through AEM Assets as a Cloud Service: how a modern digital asset management system is organised, enriched, governed and delivered. Thirty-seven short lessons, a quiz after each one and a project at the end of every level."
  audience: "Digital asset managers, content and brand teams, developers, architects and migration leads who work with, or are about to work with, AEM Assets."
  outcome: "You can design a DAM structure and metadata model, configure processing and delivery, govern rights and access, integrate through APIs, and plan an assets migration."
  levels:
    - { n: 1, title: "Foundations", goal: "Understand what a DAM is, how AEM Assets as a Cloud Service is built, and how to organise, upload and find assets." }
    - { n: 2, title: "Metadata and organisation", goal: "Make assets findable and reusable with schemas, embedded metadata, tags, collections and bulk tools." }
    - { n: 3, title: "Processing and enrichment", goal: "Generate renditions, run processing, handle video and documents, and add intelligence with smart tags." }
    - { n: 4, title: "Delivery", goal: "Deliver the right asset, in the right format and size, fast and safely, to sites and channels." }
    - { n: 5, title: "Governance and rights", goal: "Control who can do what, manage approvals, expiry and rights, and keep the library clean." }
    - { n: 6, title: "Integration, migration and scale", goal: "Connect AEM Assets to other systems, search it well, migrate into it and operate it at scale." }
  lessons:
