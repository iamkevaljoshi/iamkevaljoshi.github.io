# Course outline: the single source of truth for the Learn section.
# Each lesson file lives at _learn/<track>/<slug>.md and must match its slug, level and order here.
aem:
  title: "AEM as a Cloud Service: zero to hero"
  short: "AEM as a Cloud Service"
  icon: cloud
  lede: "A guided path from 'what is AEM?' to planning a migration. Forty short lessons, a quiz after each one and a small project at the end of every level."
  audience: "Developers, architects, testers and delivery leads who are new to AEM, or who use it daily and want the mental models behind it."
  outcome: "You can explain how AEM as a Cloud Service works end to end, build and deploy components, tune delivery, and plan a migration."
  levels:
    - { n: 1, title: "Foundations", goal: "Understand what AEM is, how content is stored and how a request is served, then run it locally." }
    - { n: 2, title: "Building pages", goal: "Build components, templates and pages the way real AEM projects do." }
    - { n: 3, title: "Content and data", goal: "Model content once and deliver it to pages, channels and APIs." }
    - { n: 4, title: "Delivery", goal: "Make it fast, cached, secure and findable: Dispatcher, CDN, indexes, performance and SEO." }
    - { n: 5, title: "Operations", goal: "Ship, configure, observe and secure the platform with Cloud Manager." }
    - { n: 6, title: "Architecture and migration", goal: "Choose the right architecture, estimate honestly and migrate safely." }
  lessons:
    - { order: 1, level: 1, slug: what-is-aem, title: "What AEM is, and what problem it solves", minutes: 8 }
    - { order: 2, level: 1, slug: author-publish-preview, title: "Author, publish and preview: the three tiers", minutes: 8 }
    - { order: 3, level: 1, slug: jcr-nodes-properties-paths, title: "The JCR: nodes, properties and paths", minutes: 9 }
    - { order: 4, level: 1, slug: sling-url-to-response, title: "Sling: how a URL becomes a response", minutes: 9 }
    - { order: 5, level: 1, slug: project-structure, title: "Project structure: core, ui.apps, ui.content and ui.config", minutes: 9 }
    - { order: 6, level: 1, slug: local-setup-sdk-maven, title: "Local setup: the SDK, Maven and your first run", minutes: 10 }
    - { order: 7, level: 1, slug: project-hello-component, title: "Project: deploy a hello-world component locally", minutes: 15, kind: project }
    - { order: 8, level: 2, slug: htl-basics, title: "HTL basics: writing markup that is secure by default", minutes: 9 }
    - { order: 9, level: 2, slug: sling-models, title: "Sling Models: where component logic belongs", minutes: 9 }
    - { order: 10, level: 2, slug: components-and-dialogs, title: "Components and dialogs", minutes: 9 }
