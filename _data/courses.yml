eds:
  title: "Edge Delivery Services: zero to hero"
  short: "Edge Delivery Services"
  icon: bolt
  lede: "A guided path from your first published page to a launched, monitored site on AEM Edge Delivery Services. Thirty short lessons, a quiz after each one and a project at the end of every level."
  audience: "Front-end developers, AEM developers, authors and architects who want to build fast sites on Edge Delivery Services."
  outcome: "You can build and publish blocks, keep Lighthouse at 100, structure content and indexes, and launch a real site."
  levels:
    - { n: 1, title: "Foundations", goal: "Understand how a document becomes a page, and publish your first one." }
    - { n: 2, title: "Blocks", goal: "Build, style and reuse blocks that authors can use with confidence." }
    - { n: 3, title: "Performance", goal: "Understand the loading model and keep the score high after launch." }
    - { n: 4, title: "Content and structure", goal: "Organise content, indexing, sitemaps, languages and many sites." }
    - { n: 5, title: "Advanced", goal: "Use Universal Editor, forms, experimentation and edge logic, then ship a real site." }
  lessons:
    - { order: 1, level: 1, slug: what-is-eds, title: "What Edge Delivery Services is, and how it differs from AEM as a Cloud Service", minutes: 8 }
