<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:#10182B;color:#E8EBF3;font-family:"Bricolage Grotesque",sans-serif;position:relative}
.ring{position:absolute;right:-140px;bottom:-220px;width:620px;height:620px;border-radius:50%;border:3px solid #F4B63F;opacity:.5}
.ring.b{right:-40px;bottom:-320px;opacity:.2}
.in{position:absolute;inset:72px 80px}
.eyebrow{font-family:"JetBrains Mono",monospace;font-size:22px;letter-spacing:.12em;text-transform:uppercase;color:#5CC6C9}
h1{font-size:118px;line-height:.95;letter-spacing:-.045em;margin:28px 0 26px;font-weight:800}
h1 span{color:#F4B63F}
p{font-size:34px;line-height:1.3;margin:0;max-width:820px;color:#C9CFDF}
.foot{position:absolute;left:0;bottom:0;display:flex;gap:44px;font-size:24px;color:#9BA4BE}
.foot b{color:#E8EBF3}
</style></head><body>
<div class="ring"></div><div class="ring b"></div>
<div class="in">
  <div class="eyebrow">Solutions Architect · Mumbai</div>
  <h1>Keval Joshi<span>.</span></h1>
  <p>Enterprise Adobe Experience Manager platforms and AEM as a Cloud Service migrations.</p>
  <div class="foot"><span><b>12+ yrs</b> engineering</span><span><b>AEM Architect</b> Adobe certified</span><span><b>DEPT®</b></span></div>
</div>
</body></html>
