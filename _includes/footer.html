{%- assign p = site.data.profile -%}
<footer>
  <div class="wrap foot">
    <a class="foot-brand" href="{{ '/' | relative_url }}" aria-label="{{ p.name }}, home"><span class="logo-tile sm">{% include logo-mark.svg %}</span><span>© {{ 'now' | date: '%Y' }} {{ p.name }}</span></a>
    <nav class="foot-nav" aria-label="Footer">
      <a href="{{ '/experience/' | relative_url }}">Experience</a>
      <a href="{{ '/certifications/' | relative_url }}">Certifications</a>
      <a href="{{ '/blog/' | relative_url }}">Blog</a>
      <a href="{{ '/work/' | relative_url }}">Work</a>
      <a href="{{ '/about/' | relative_url }}">About</a>
      <a href="{{ '/contact/' | relative_url }}">Contact</a>
    </nav>
    <span class="foot-links">
      <a href="{{ p.linkedin }}" target="_blank" rel="noopener">LinkedIn</a>
      <a href="{{ p.github }}" target="_blank" rel="noopener">GitHub</a>
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
    </span>
  </div>
</footer>
