<div class="progress" id="progress"></div>
<a class="skip" href="#main">Skip to content</a>
<header class="nav" id="nav">
  <div class="wrap nav-inner">
    <a class="logo" href="{{ '/' | relative_url }}" aria-label="{{ site.data.profile.name }}, home">
      <span class="logo-tile">{% include logo-mark.svg %}</span>
      <span class="logo-text"><span class="logo-name">{{ site.data.profile.name }}</span><span class="logo-role">{{ site.data.profile.title }}</span></span>
    </a>
    <nav class="nav-links" id="navLinks" aria-label="Main">
      <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Home</a>
      <a href="{{ '/about/' | relative_url }}"{% if page.url contains '/about/' %} aria-current="page"{% endif %}>About</a>
      <a href="{{ '/experience/' | relative_url }}"{% if page.url contains '/experience/' %} aria-current="page"{% endif %}>Experience</a>
      <a href="{{ '/certifications/' | relative_url }}"{% if page.url contains '/certifications/' %} aria-current="page"{% endif %}>Certifications</a>
      <a href="{{ '/work/' | relative_url }}"{% if page.url contains '/work/' %} aria-current="page"{% endif %}>Work</a>
      <a href="{{ '/tools/' | relative_url }}"{% if page.url contains '/tools/' %} aria-current="page"{% endif %}>Tools</a>
      <a href="{{ '/blog/' | relative_url }}"{% if page.url == '/blog/' or page.layout == 'post' or page.layout == 'category' %} aria-current="page"{% endif %}>Blog</a>
      <a href="{{ '/contact/' | relative_url }}"{% if page.url contains '/contact/' %} aria-current="page"{% endif %}>Contact</a>
    </nav>
    <div class="nav-tools">
      <button class="search-btn" id="searchBtn" type="button" aria-label="Search the site" aria-haspopup="dialog" aria-keyshortcuts="Control+K Meta+K /">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
        <span class="search-hint">Search</span><kbd class="search-kbd" id="searchKbd">Ctrl K</kbd>
      </button>
      <button class="theme-btn" id="themeBtn" type="button" aria-label="Switch colour theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button class="menu-btn" id="menuBtn" type="button" aria-label="Menu" aria-expanded="false" aria-controls="navLinks">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </div>
</header>
<dialog class="search-dlg" id="searchDlg" aria-label="Search the site">
  <form method="dialog" class="search-box" role="search" onsubmit="return false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
    <input id="searchInput" type="search" placeholder="Search posts, AEM topics, certifications…" autocomplete="off" spellcheck="false"
      role="combobox" aria-expanded="true" aria-controls="searchResults" aria-autocomplete="list">
    <button type="button" class="search-close" id="searchClose" aria-label="Close search">Esc</button>
  </form>
  <ul class="search-results" id="searchResults" role="listbox" aria-label="Results"></ul>
  <p class="search-foot"><span><kbd>↑</kbd><kbd>↓</kbd> to move</span><span><kbd>Enter</kbd> to open</span><span><kbd>Esc</kbd> to close</span></p>
</dialog>
